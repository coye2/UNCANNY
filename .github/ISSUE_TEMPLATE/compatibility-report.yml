# UNCANNY compatibility report
name: Compatibility report
description: Report a game, emulator, API, neural-rendering result, or REVENANT result.
title: "[Compatibility] <game> — <API> — <x86/x64>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing UNCANNY. Please report observed evidence rather than assuming that provider/file detection means neural rendering succeeded.
  - type: input
    id: game
    attributes:
      label: Game / emulator
      placeholder: Resident Evil 4 HD Project, PCSX2, etc.
    validations:
      required: true
  - type: input
    id: exe
    attributes:
      label: Executable
      placeholder: bio4.exe / pcsx2-qt.exe
    validations:
      required: true
  - type: dropdown
    id: api
    attributes:
      label: Graphics API
      options:
        - D3D9
        - D3D10 / 10.1
        - D3D11
        - D3D12
        - Vulkan
        - OpenGL
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - x86 / 32-bit
        - x64 / 64-bit
        - Unknown
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: RTX 4060 Ti 16 GB — driver version
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: UNCANNY revision / ABI
      placeholder: release-alpha.rc2.hotfix.2 / ABI 140
    validations:
      required: true
  - type: dropdown
    id: attach
    attributes:
      label: Did the UNCANNY runtime attach?
      options:
        - Yes
        - No
        - Unsure
    validations:
      required: true
  - type: textarea
    id: neural
    attributes:
      label: DLSS 5 / Feature-18 evidence
      description: Include create/evaluate/return/present counters and the first failure stage if available.
      placeholder: |
        FeatureCreateAttempts=
        FeatureCreateSuccess=
        FeatureEvaluateAttempts=
        FeatureEvaluateSuccess=
        SuccessfulEvaluations=
        NeuralReturnCount=
        PresentUseCount=
        RenderedUse=
        LastFailureStage=
        LastFailureReason=
  - type: textarea
    id: revenant
    attributes:
      label: REVENANT evidence
      description: If tested, include capture, inference, replacement, reload/bind, visible-use and restore evidence.
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: Exact steps from launch to the result.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: UNCANNY-STATUS report
      description: Paste a sanitized report or attach it. Remove personal folder names if desired.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / package check
      options:
        - label: I did not upload a private workspace-recovery archive or proprietary source.
          required: true
