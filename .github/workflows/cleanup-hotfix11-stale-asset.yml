name: Cleanup Hotfix 11 stale asset
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-hotfix11-stale-asset.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded MALWARE-CHECK.md release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_ID=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v0.20.0-alpha.1-elysium-hotfix11 --jq '.assets[] | select(.name=="MALWARE-CHECK.md") | .id' | head -n1)
          if [ -n "$ASSET_ID" ]; then
            gh api --method DELETE repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID
            echo "Removed stale MALWARE-CHECK.md asset $ASSET_ID"
          else
            echo 'No stale MALWARE-CHECK.md asset present.'
          fi
