name: Promote Engine 4.5 release to latest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/promote-engine45-latest.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote existing Engine 4.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            repos/${{ github.repository }}/releases/391080174 \
            -F prerelease=false \
            -F draft=false
          echo "Engine 4.5 release promoted to normal published release."
