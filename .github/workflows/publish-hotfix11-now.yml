name: Publish ELYSIUM Hotfix 11 now
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-hotfix11-now.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact audited private-build artifact
        shell: bash
        run: |
          curl -L --fail --retry 3 -o hotfix11-artifact.zip 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-1bfc-81f5-b89b-ae2b04967eb3/raw?se=2026-09-17T15%3A05%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=18deab3b-cd96-5a1d-b9e4-b7a1fe27f83c&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T14%3A16%3A13Z&ske=2026-09-18T14%3A16%3A13Z&sks=b&skv=2026-02-06&sig=tdUw9QTkMRLYw5vY8mBSIyG4mIwyf6UnPyO1hKfUqo8%3D'
          echo '7c62c34029c0d2ad425a20ce1966682612a7214e69cb6df78f19ed6efee7f63a  hotfix11-artifact.zip' | sha256sum -c -
          unzip -q hotfix11-artifact.zip -d hotfix11-artifact
          cp hotfix11-artifact/dist/public-hotfix11/UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip .
          cp hotfix11-artifact/dist/public-hotfix11/UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip.sha256 .
          echo '14e28fad9a016a096e58167eebc53d8b96ead41687b1b366fbb34c92427c7bd7  UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip' | sha256sum -c -
          unzip -t UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip >/dev/null
      - name: Write release notes
        shell: bash
        run: |
          cat > HOTFIX11-RELEASE-NOTES.md <<'EOF'
          # UNCANNY v0.20.0-alpha.1 — ELYSIUM Hotfix 11

          Targeted compatibility hotfix based directly on a PCSX2 x64 / D3D11 tester report.

          ## Fixed

          - D3D11 startup now fails open. The first native frames reach the game's original `Present` / `Present1` before optional UNCANNY image processing or Control Deck composition can run.
          - Feature-18 / DLSS 5 initialization on D3D11 now waits for a healthy, advancing native Present stream instead of becoming part of first-frame startup.
          - While neural startup is deferred, UNCANNY keeps the live source frame instead of substituting stale neural output.
          - Added `PRESENT_PREPROCESS`, `PRESENT_NATIVE_CALL`, `PRESENT1_PREPROCESS`, `PRESENT1_NATIVE_CALL`, and `PRESENT_SUCCEEDED` diagnostics so future stalls can be localized accurately.
          - The tester's separate REVENANT path is preserved; the triggering report completed 38/38 texture jobs while D3D11 presentation was stalled.
          - `Host64LaunchAttempted=0` is no longer treated as evidence of failure for the normal x64 in-process D3D11 route.

          ## Launcher / packaging

          - The public user-facing launcher is now native **`UNCANNY.exe`** at the root of the extracted package.
          - The old top-level `UNCANNY.cmd` entry point is no longer shipped as the normal launcher.
          - `UNCANNY.exe` is a Windows GUI executable and starts the bundled launcher without exposing a console window.
          - The already-published UNCANNY 2.5 Lucid engine bundle is preserved byte-for-byte by its manifest hashes, so ELYSIUM/Lucid engine switching remains available.

          ## Preserved

          - Hotfix 10 ELYSIUM pass and slider wiring
          - PCSX2 wrapper behavior
          - REVENANT
          - install/update/rollback flow
          - provider policy
          - protected shader resources
          - D3D9, D3D10, and D3D12 paths outside this targeted D3D11 startup change

          ## Verification

          - Hotfix 9 ELYSIUM regression: PASS
          - Hotfix 10 control wiring regression: PASS
          - Hotfix 11 D3D11 fail-open regression: PASS
          - native `UNCANNY.exe` regression: PASS
          - 12 public Windows diagnostic binaries compiled successfully
          - 16 focused Hotfix 11 acceptance checks: PASS
          - x86 + x64 production binaries: PASS
          - protected shader verification: PASS
          - production PE hardening audit: PASS across all 11 current production/helper binaries
          - public ZIP integrity and strict package audit: PASS

          **Runtime:** `release-alpha.1.elysium-hotfix11`  
          **ABI:** `141`

          **SHA-256:**  
          `14e28fad9a016a096e58167eebc53d8b96ead41687b1b366fbb34c92427c7bd7`

          This remains alpha software. The original PCSX2/GPU configuration should be retested to confirm the hardware-specific black-screen regression is resolved in practice.
          EOF
      - name: Publish Hotfix 11 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.20.0-alpha.1-elysium-hotfix11
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'UNCANNY v0.20.0-alpha.1 — ELYSIUM Hotfix 11' --notes-file HOTFIX11-RELEASE-NOTES.md --prerelease
            gh release upload "$TAG" UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip.sha256 --clobber
          else
            gh release create "$TAG" UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip.sha256 --target main --title 'UNCANNY v0.20.0-alpha.1 — ELYSIUM Hotfix 11' --notes-file HOTFIX11-RELEASE-NOTES.md --prerelease
          fi
