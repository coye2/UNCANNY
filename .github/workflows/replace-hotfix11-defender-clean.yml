name: Replace Hotfix 11 Defender-clean package
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-hotfix11-defender-clean.yml
permissions:
  contents: write
jobs:
  replace-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download clean artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-ac80-81f5-8b0c-65af0586f061/raw?se=2026-09-17T18%3A06%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=e4387c59-3076-52a5-92e3-82fae3256447&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T17%3A52%3A23Z&ske=2026-09-18T17%3A52%3A23Z&sks=b&skv=2026-02-06&sig=ITCZaOkYSU/Z41s9wcvIjjKoxUH0wsEpWZpEUgZiFHw%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o artifact.zip "$ARTIFACT_URL"
          unzip -q artifact.zip -d artifact
          test -f artifact/dist/public-hotfix11/UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip
      - name: Verify payload
        shell: bash
        run: |
          set -euo pipefail
          ZIP=artifact/dist/public-hotfix11/UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip
          echo "8eb7835e6dc50e82d27622e91aaf1f285e462e7e79bd4578ed74ad3986d59f5e  $ZIP" | sha256sum -c -
          python -c "import zipfile,json; p='$ZIP'; z=zipfile.ZipFile(p); n=z.namelist(); assert not [x for x in n if '/diagnostics/' in x]; r='UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11/'; assert json.loads(z.read(r+'public-build.json')).get('diagnostics')==[]"
      - name: Replace release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP=artifact/dist/public-hotfix11/UNCANNY-v0.20.0-alpha.1-ELYSIUM-HOTFIX11.zip
          SUM="$ZIP.sha256"
          gh release upload v0.20.0-alpha.1-elysium-hotfix11 "$ZIP" "$SUM" --clobber
