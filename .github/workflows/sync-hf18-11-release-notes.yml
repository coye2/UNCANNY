name: Sync HF18.11 release notes

on:
  push:
    branches: [release-staging-hf18-11]
    paths:
      - .release-staging/HF18.11-RELEASE-NOTES.md

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GitHub release description
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.20.0-alpha.1-elysium-engine45-hf18.11
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file .release-staging/HF18.11-RELEASE-NOTES.md
